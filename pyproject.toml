[project]
name = "classroom-mcp"
version = "0.1.0"
description = "Student and class management — roster, timetable, assignments, progress"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
    "aiosqlite",
    "httpx",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-dotenv",
    "starlette",
    "uvicorn",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
