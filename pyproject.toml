[project]
name = "classroom-mcp"
version = "0.2.0"
description = "Student and class management - roster, timetable, assignments, progress"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "aiosqlite",
    "httpx",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-dotenv",
    "starlette",
    "uvicorn",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=classroom_mcp", "--cov-report=term-missing", "--cov-fail-under=30"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["T20"]
"scripts/**/*" = ["T20"]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0,<0.17",
]
